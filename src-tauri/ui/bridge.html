<!doctype html>
<!--
  Körpü pəncərəsi (tray → "Kompüter körpüsü"): qoşma kodu, qovluqlar, status.
  Tətbiqin içindən kdost:// ilə verilir (bridge_ui.rs), şəbəkədən heç nə yükləmir.
  Bazadan/botdan gələn mətnlər YALNIZ textContent ilə yazılır (innerHTML yox) —
  qovluq və ya cihaz adı HTML/skript kimi işə düşməsin.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KalBi Dost</title>
<style>
  :root {
    --bg: #14121a; --panel: #1d1a25; --raise: #26222f; --line: #332e3f;
    --tx: #ece9f3; --tx2: #9a93a8; --acc: #7c5cff; --acc2: #a48bff;
    --ok: #3ccf8e; --warn: #f2b84b; --err: #ef5a4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--tx2); margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--tx2); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tx2); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  label { display: block; color: var(--tx2); font-size: 12px; margin: 10px 0 4px; }
  input[type=text] { width: 100%; background: var(--raise); border: 1px solid var(--line);
    color: var(--tx); border-radius: 8px; padding: 9px 11px; font: inherit; }
  input#code { font: 600 20px/1.2 Consolas, monospace; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
  input:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
  button { font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--raise); color: var(--tx); }
  button:hover { border-color: var(--acc2); }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .full { width: 100%; margin-top: 14px; padding: 10px; }
  .err { color: var(--err); margin-top: 8px; }
  .err:empty { display: none; }
  .muted { color: var(--tx2); }
  .small { font-size: 12px; }
  ul.folders { list-style: none; margin: 0; padding: 0; }
  ul.folders li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  ul.folders li:first-child { border-top: 0; }
  .fname { font-weight: 600; }
  .fpath { color: var(--tx2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { padding: 4px 9px; }
  ol.steps { margin: 6px 0 0; padding-left: 20px; color: var(--tx2); }
  pre.act { margin: 0; max-height: 150px; overflow: auto; font: 12px/1.5 Consolas, monospace; color: var(--tx2); white-space: pre-wrap; }
  .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .check input { margin-top: 3px; accent-color: var(--acc); }
  .hidden { display: none !important; }
  .trustbar { background: rgba(242,184,75,.14); border: 1px solid rgba(242,184,75,.55); color: #ffd98a;
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600; }
  .check.trust input { accent-color: var(--warn); }
  footer { color: var(--tx2); font-size: 11px; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
  <h1 id="t_title"></h1>
  <p class="sub" id="t_sub"></p>

  <!-- Bu yığımda körpü sönülüdür (Supabase dəyişənləri yoxdur) -->
  <div id="v_disabled" class="card hidden"><span id="t_disabled"></span></div>

  <!-- Qoşulmayıb / ayrılıb -->
  <div id="v_pair" class="hidden">
    <div id="revoked_note" class="card hidden"><span class="row"><span class="dot err"></span><span id="t_revoked"></span></span></div>
    <div class="card">
      <h2 id="t_pair_h"></h2>
      <ol class="steps"><li id="t_step1"></li><li id="t_step2"></li></ol>
      <label for="code" id="t_code"></label>
      <input id="code" type="text" maxlength="9" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH">
      <label for="dname" id="t_name"></label>
      <input id="dname" type="text" maxlength="60" autocomplete="off">
      <button id="b_pair" class="primary full"></button>
      <div id="pair_err" class="err"></div>
    </div>
  </div>

  <!-- Qoşulub -->
  <div id="v_main" class="hidden">
    <div id="trustbar" class="trustbar hidden"></div>
    <div class="card">
      <div class="row">
        <span id="st_dot" class="dot"></span>
        <div class="grow">
          <div id="st_name" class="fname"></div>
          <div id="st_text" class="muted small"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 id="t_folders"></h2>
      <p id="t_folders_none" class="muted small hidden"></p>
      <ul id="folders" class="folders"></ul>
      <button id="b_add" class="full"></button>
      <div id="folder_err" class="err"></div>
      <p class="muted small" id="t_folders_hint"></p>
    </div>

    <div class="card">
      <h2 id="t_perm"></h2>
      <label class="check"><input type="checkbox" id="ask_read"><span><span id="t_ask_read"></span><br><span class="muted small" id="t_ask_read_hint"></span></span></label>
      <p class="muted small" id="t_write_always"></p>
      <label class="check trust"><input type="checkbox" id="trust"><span><span id="t_trust"></span><br><span class="muted small" id="t_trust_hint"></span></span></label>
    </div>

    <div class="card">
      <h2 id="t_activity"></h2>
      <pre id="act" class="act"></pre>
    </div>

    <button id="b_unlink" class="danger full"></button>
  </div>

  <footer id="ver"></footer>

// Sabit mətnlər
for (const k of ["title","sub","disabled","revoked","pair_h","step1","step2","code","name","folders",
                 "folders_none","folders_hint","perm","ask_read","ask_read_hint","write_always","activity",
                 "trust","trust_hint"]) {
  txt("t_" + k, T[k]);
}
txt("b_pair", T.pair); txt("b_add", T.add); txt("b_unlink", T.unlink);
document.title = "KalBi Dost — " + T.title;

let state = null;
let nameTouched = false;

// Kod sahəsi: böyük hərf, yalnız hərf/rəqəm, 4-dən sonra defis.
$("code").addEventListener("input", (ev) => {
  const raw = ev.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  ev.target.value = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
  txt("pair_err", "");
});
$("dname").addEventListener("input", () => { nameTouched = true; });
$("code").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("b_pair").click(); });

$("b_pair").addEventListener("click", async () => {
  const code = $("code").value.replace(/-/g, "");
  if (code.length !== 8) { txt("pair_err", T.e_short); return; }
  const b = $("b_pair");
  b.disabled = true; b.textContent = T.pairing; txt("pair_err", "");
  try {
    await inv("bridge_pair", { code, name: $("dname").value });
    $("code").value = "";
    await refresh();
  } catch (e) {
    txt("pair_err", errText(e));
  } finally {
    b.disabled = false; b.textContent = T.pair;
  }
});

$("b_add").addEventListener("click", async () => {
  txt("folder_err", "");
  try { await inv("bridge_add_folder"); await refresh(); }
  catch (e) { txt("folder_err", errText(e)); }
});

$("ask_read").addEventListener("change", async (ev) => {
  try { await inv("bridge_set_read_policy", { policy: ev.target.checked ? "ask" : "allow" }); }
  catch (e) { ev.target.checked = !ev.target.checked; }
});

$("trust").addEventListener("change", async (ev) => {
  try { await inv("bridge_set_trust", { on: ev.target.checked }); await refresh(); }
  catch (e) { ev.target.checked = !ev.target.checked; }
});

// "Ayır" iki addımlıdır (brauzer confirm() pəncərəsi əvəzinə — WebView-da
// doğma dialoq tətbiqi bloklaya bilər).
let unlinkArmed = null;
$("b_unlink").addEventListener("click", async () => {
  const b = $("b_unlink");
  if (!unlinkArmed) {
    b.textContent = T.unlink_confirm;
    unlinkArmed = setTimeout(() => { unlinkArmed = null; b.textContent = T.unlink; }, 4000);
    return;
  }
  clearTimeout(unlinkArmed); unlinkArmed = null;
  b.disabled = true;
  try { await inv("bridge_unlink"); } finally { b.disabled = false; b.textContent = T.unlink; await refresh(); }
});

function renderFolders(list) {
  const ul = $("folders");
  ul.replaceChildren();
  show("t_folders_none", list.length === 0);
  for (const f of list) {
    const li = document.createElement("li");
    const box = document.createElement("div"); box.className = "grow";
    const n = document.createElement("div"); n.className = "fname"; n.textContent = f.name;
    const p = document.createElement("div"); p.className = "fpath"; p.textContent = f.path; p.title = f.path;
    box.append(n, p);
    const x = document.createElement("button"); x.className = "x"; x.textContent = T.remove;
    x.addEventListener("click", async () => { await inv("bridge_remove_folder", { name: f.name }); await refresh(); });
    li.append(box, x);
    ul.append(li);
  }
}

function render(s) {
  state = s;
  if (s.version) txt("ver", T.ver + s.version);
  if (!s.enabled) {
    show("v_disabled", true); show("v_pair", false); show("v_main", false);
    return;
  }
  show("v_disabled", false);
  const st = s.status || { state: "unpaired" };
  const paired = st.state !== "unpaired" && st.state !== "revoked";
  show("v_pair", !paired); show("v_main", paired);
  if (!paired) {
    show("revoked_note", st.state === "revoked");
    if (!nameTouched && !$("dname").value) $("dname").value = s.default_name || "";
    return;
  }
  const dot = $("st_dot");
  dot.className = "dot";
  txt("st_name", s.device_name || "");
  if (st.state === "online") {
    dot.classList.add(st.live ? "ok" : "warn");
    txt("st_text", st.live ? T.st_online_live : T.st_online_poll);
  } else if (st.state === "offline") {
    dot.classList.add("err"); txt("st_text", T.st_offline);
  } else {
    txt("st_text", T.st_connecting);
  }
  renderFolders(s.folders || []);
  $("ask_read").checked = s.read_policy !== "allow";
  $("trust").checked = !!s.trust;
  show("trustbar", !!s.trust);
  txt("trustbar", T.trust_on);
  $("act").textContent = (s.activity && s.activity.length) ? s.activity.join("\n") : T.activity_none;
}

async function refresh() {
  try { render(await inv("bridge_state")); } catch (e) { /* pəncərə bağlanır */ }
}

// Status dəyişikliyi üçün yüngül sorğu: yalnız pəncərə görünəndə.
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 1500);
</script>
</body>
</html>
