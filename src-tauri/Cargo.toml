[package]
name = "kalbi-dost"
version = "0.1.2"
edition = "2021"

[lib]
name = "kalbi_dost_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sys-locale = "0.3"
# generate_context! makrosu yaranan kodda serde_json-a müraciət edir.
# Körpü (bridge.rs) də RPC gövdələri və iş nəticələri üçün işlədir.
serde_json = "1"

# --- Körpü (2-ci mərhələ, bridge.rs) ---
# Versiyalar updater-in artıq çəkdiyi ilə eynidir — ikinci nüsxə yığılmır,
# .exe böyümür (Cargo.lock-da reqwest 0.13, tokio 1, rustls 0.23 + ring).
serde = { version = "1", features = ["derive"] }
# Supabase RPC-ləri (PostgREST). Standart xüsusiyyətlər: rustls + Windows
# sertifikat anbarı (platform verifier) — updater ilə eyni TLS yolu.
reqwest = "0.13"
# Tauri-nin öz tokio runtime-ı işlədilir; bura yalnız lazım olan hissələr.
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
# Realtime (Phoenix websocket) — yeni işin siqnalı. TLS rustls ilə, sertifikat
# yoxlaması reqwest-dəki kimi Windows anbarından (antivirus/korporativ
# proxy sertifikatı sistemdədirsə işləsin). Kripto: ring (lock-dakı ilə eyni).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# expires_at (serverin vaxtı) və HTTP Date başlığı ilə saat fərqi.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }

# Buraxılış yığımı: kiçik fayl (endirmə və Store paketi üçün).
# lto — kodu bütöv optimallaşdırır, strip — debug simvollarını çıxarır.
# Yığım bir az uzanır, amma .exe ~30–40% kiçilir.
[profile.release]
lto = true
codegen-units = 1
strip = true
