[package]
name = "kalbi-dost"
version = "0.1.0"
edition = "2021"

[lib]
name = "kalbi_dost_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sys-locale = "0.3"
# generate_context! makrosu yaranan kodda serde_json-a müraciət edir.
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }

# Buraxılış yığımı: kiçik fayl (endirmə və Store paketi üçün).
# lto — kodu bütöv optimallaşdırır, strip — debug simvollarını çıxarır.
# Yığım bir az uzanır, amma .exe ~30–40% kiçilir.
[profile.release]
lto = true
codegen-units = 1
strip = true
