# Windows yığımı və buraxılış.
#
# Nə vaxt işləyir:
#   • v* teqi push olunanda (məs. v0.1.0) → yığır və GitHub Release yaradır.
#   • Actions səhifəsindən əl ilə (workflow_dispatch):
#       - "publish" seçilməyib → yalnız yığır, faylları "Artifacts" kimi saxlayır.
#       - "publish" seçilib → teqi (v<versiya>) özü yaradır və buraxılış edir.
#         Niyə lazımdır: teqi yerli komputerdən push etmək hər dəfə mümkün
#         olmur; bu yol yalnız GitHub səhifəsindən (və ya API-dən) işləyir.
#
# Çıxış:
#   KalBi-Dost_<v>_x64-setup.exe   — imzasız quraşdırıcı (versiyalı)
#   KalBi-Dost-Setup.exe           — eyni fayl, sabit adla (saytdakı düymə üçün)
#   KalBi-Dost_<v>_x64-setup.exe.sig, latest.json — Tauri updater üçün
#   KalBi-Dost_<v>_x64.msix        — Microsoft Store üçün (MSIX_* dəyişənləri varsa)

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Buraxılış et (tauri.conf.json-dakı versiya ilə teq yaradılır)"
        type: boolean
        default: false

# Release yaratmaq və fayl yükləmək üçün.
permissions:
  contents: write

# Eyni teq üçün iki yığım paralel getməsin (fayllar bir-birini əvəz edərdi).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      # Körpü (bridge.rs): yığım vaxtı .exe-yə yazılır (option_env!). Yalnız
      # anon/publishable açar — service_role HEÇ VAXT. Boşdursa körpü sönülü olur.
      DOST_SUPABASE_URL: ${{ vars.DOST_SUPABASE_URL }}
      DOST_SUPABASE_ANON_KEY: ${{ vars.DOST_SUPABASE_ANON_KEY }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Uzun Rust yığımından ƏVVƏL: versiya/teq uyğunluğu və sirlər.
      # Səhv olsa 10 dəqiqə sonra yox, dərhal dayansın.
      - name: Yoxlamalar
        run: node scripts/package.mjs check

      # Əl ilə buraxılışda eyni versiyanı ikinci dəfə buraxmırıq: artıq
      # quraşdırılmış tətbiqlər "yeni versiya" görməz, Store da eyni versiyanı
      # qəbul etməz. Versiyanı artırmaq unudulubsa, burada dayansın.
      - name: Versiya artıq buraxılıbmı
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::v$V artıq buraxılıb. src-tauri/tauri.conf.json-da versiyanı artırın."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # Təkrar yığımlarda asılılıqlar yenidən kompilyasiya olunmasın (~10 dəq → ~3 dəq).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      # İkonlar hər dəfə app-icon.png-dən yaradılır: loqonu dəyişmək üçün
      # yalnız o bir faylı əvəz etmək kifayətdir.
      - name: İkonlar
        run: |
          npx tauri icon app-icon.png
          rm -rf src-tauri/icons/android src-tauri/icons/ios

      - name: Updater açarı
        run: node scripts/package.mjs ci-config

      - name: Yığım (NSIS)
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      - name: Faylları topla (+ latest.json)
        run: node scripts/package.mjs collect

      - name: MSIX (Store)
        run: node scripts/package.mjs msix

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kalbi-dost-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      # MSIX-in açılmış qovluğu: Windows-da Developer Mode ilə imzasız
      # quraşdırıb Store rejimini sınamaq üçün (README → "MSIX-i yerli sınamaq").
      - name: Artifacts (MSIX qovluğu)
        if: hashFiles('target-msix/stage/AppxManifest.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kalbi-dost-msix-stage-${{ github.ref_name }}
          path: target-msix/stage/

      - name: GitHub Release
        if: github.ref_type == 'tag' || env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # Təkrar işə salınanda (re-run) release artıq var — faylları əvəz edirik.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # --target: teq yoxdursa, məhz bu yığımın commit-inə yaradılır.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "KalBi Dost ${TAG#v}" --generate-notes
          fi
